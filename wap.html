<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #password-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .password-card {
      background: #1e293b;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      color: #ffffff;
      max-width: 400px;
      width: 90%;
      border: 1px solid #334155;
    }

    .password-card h2 {
      margin-bottom: 8px;
      font-size: 24px;
    }

    .password-card p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-group input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .input-group input:focus {
      border-color: #2563eb;
    }

    .input-group button {
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-group button:hover {
      background: #1d4ed8;
    }

    #error-msg {
      color: #ef4444;
      margin-top: 14px;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <!-- Password Overlay -->
  <div id="password-overlay">
    <div class="password-card">
      <h2>Access Restricted</h2>
      <p>Is page ko access karne ke liye password enter karein:</p>
      <div class="input-group">
        <input type="password" id="site-password" placeholder="Enter Password" onkeypress="handleKeyPress(event)" />
        <button onclick="checkPassword()">Unlock</button>
      </div>
      <p id="error-msg"></p>
    </div>
  </div>

  <script>
    const CORRECT_PASSWORD = "mysecretpassword"; // Yahan apna password set karein
    const TARGET_URL = "https://akshatjain30100-creator.github.io/HR-Dept-Aryans-Bizhub/u.html";

    function checkPassword() {
      const inputPass = document.getElementById("site-password").value;
      const errorMsg = document.getElementById("error-msg");

      if (inputPass === CORRECT_PASSWORD) {
        // Sahi password dalte hee redirect kar dega
        window.location.href = TARGET_URL;
      } else {
        errorMsg.innerText = "Incorrect Password! Try again.";
      }
    }

    // Enter key dabane par bhi form submit ho jayega
    function handleKeyPress(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    }
  </script>

</body>
</html>
