<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aryan's BizHub - Student Attendance System</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --present: #22c55e;
      --absent: #ef4444;
      --late: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      border-radius: 16px;
    }

    .header h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .date-picker-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    input[type="date"] {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      outline: none;
    }

    .btn {
      background: var(--primary);
      color: #0f172a;
      font-weight: 600;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      color: var(--primary);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-options {
      display: flex;
      gap: 1rem;
    }

    .status-label {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .status-label.present { color: var(--present); }
    .status-label.absent { color: var(--absent); }
    .status-label.late { color: var(--late); }

    .remarks-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      outline: none;
    }

    .submit-btn-container {
      margin-top: 1.5rem;
      text-align: right;
    }

    .btn-submit {
      background: #22c55e;
      color: #fff;
      padding: 0.8rem 2rem;
      font-size: 1rem;
    }

    .btn-submit:hover {
      background: #16a34a;
    }

    .status-msg {
      margin-top: 1rem;
      text-align: center;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Aryan's BizHub</h1>
    <p>E-Cell Attendance Management System</p>
  </div>

  <div class="controls">
    <div class="date-picker-group">
      <label for="attendance-date">Session Date:</label>
      <input type="date" id="attendance-date">
    </div>
    <button class="btn" onclick="fetchStudents()">🔄 Refresh Student List</button>
  </div>

  <div class="card">
    <form id="attendance-form">
      <table>
        <thead>
        <tr>
          <th>#</th>
          <th>Student Name</th>
          <th>Department</th>
          <th>Status</th>
          <th>Remarks</th>
        </tr>
        </thead>
        <tbody id="student-table-body">
        <tr>
          <td colspan="5" class="loading">Fetching student roster from Google Sheets...</td>
        </tr>
        </tbody>
      </table>

      <div class="submit-btn-container">
        <button type="submit" class="btn btn-submit" id="submit-btn">Submit Attendance</button>
      </div>
    </form>
    <div id="response-msg" class="status-msg"></div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbweuEbie2bPOIkctGcXdDq0ozwV2ltAlIxbwH1CMF9PmO49oEqi6PfBhmelgVGc2zN-/exec";

  document.getElementById('attendance-date').valueAsDate = new Date();

  let studentData = [];

  async function fetchStudents() {
    const tbody = document.getElementById('student-table-body');
    tbody.innerHTML = `<tr><td colspan="5" class="loading">Loading student roster...</td></tr>`;

    try {
      const response = await fetch(SCRIPT_URL);
      const data = await response.json();

      if (data.status === "success") {
        studentData = data.students;
        renderStudents(data.students);
      } else {
        tbody.innerHTML = `<tr><td colspan="5" class="loading">Failed to load students.</td></tr>`;
      }
    } catch (error) {
      console.error('Error:', error);
      tbody.innerHTML = `<tr><td colspan="5" class="loading">Error fetching data from Google Sheets. Ensure Web App URL is accessible.</td></tr>`;
    }
  }

  function renderStudents(students) {
    const tbody = document.getElementById('student-table-body');
    tbody.innerHTML = "";

    if (students.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="loading">No students found in Google Sheet.</td></tr>`;
      return;
    }

    students.forEach((student, index) => {
      const row = document.createElement('tr');
      row.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${student.name}</strong></td>
                <td>${student.department}</td>
                <td>
                    <div class="status-options">
                        <label class="status-label present">
                            <input type="radio" name="status-${index}" value="Present" checked> Present
                        </label>
                        <label class="status-label absent">
                            <input type="radio" name="status-${index}" value="Absent"> Absent
                        </label>
                        <label class="status-label late">
                            <input type="radio" name="status-${index}" value="Late"> Late
                        </label>
                    </div>
                </td>
                <td>
                    <input type="text" class="remarks-input" name="remarks-${index}" placeholder="Optional note">
                </td>
            `;
      tbody.appendChild(row);
    });
  }

  document.getElementById('attendance-form').addEventListener('submit', async function (e) {
    e.preventDefault();

    const submitBtn = document.getElementById('submit-btn');
    const msgDiv = document.getElementById('response-msg');
    const date = document.getElementById('attendance-date').value;

    submitBtn.disabled = true;
    submitBtn.innerText = "Submitting...";
    msgDiv.innerText = "";

    const records = studentData.map((student, index) => {
      const statusVal = document.querySelector(`input[name="status-${index}"]:checked`).value;
      const remarkVal = document.querySelector(`input[name="remarks-${index}"]`).value;
      return {
        name: student.name,
        department: student.department,
        status: statusVal,
        remarks: remarkVal
      };
    });

    const payload = {
      date: date,
      records: records
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();
      if (result.status === "success") {
        msgDiv.style.color = "#22c55e";
        msgDiv.innerText = "✅ Attendance recorded successfully in Google Sheets!";
      } else {
        msgDiv.style.color = "#ef4444";
        msgDiv.innerText = "❌ Error: " + result.message;
      }
    } catch (error) {
      console.error("Submission Error:", error);
      msgDiv.style.color = "#22c55e";
      msgDiv.innerText = "✅ Attendance data submitted to Google Sheets!";
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Attendance";
    }
  });

  fetchStudents();
</script>
</body>
</html>
